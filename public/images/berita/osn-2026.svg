<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Background decorative pattern -->
  <circle cx="1000" cy="150" r="300" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="200" cy="550" r="250" fill="#fef3c7" opacity="0.6"/>

  <!-- Science elements -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <!-- Big Trophy Emoji or graphic -->
    <text y="0" font-size="140">🏆</text>
    
    <!-- Title -->
    <text y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" fill="#0f172a">
      JUARA 1 OLIMPIADE SAINS NASIONAL 2026
    </text>
    
    <!-- Subtitle -->
    <text y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="24" fill="#2563eb">
      SMAN 1 Nusantara Raih Medali Emas Bidang Fisika
    </text>
    
    <!-- Badge -->
    <rect x="-160" y="180" width="320" height="44" rx="22" fill="url(#gold)"/>
    <text y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#ffffff">
      TINGKAT NASIONAL 2026
    </text>
  </g>
</svg>
