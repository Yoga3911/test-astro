<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="28" fill="url(#cardBg)"/>
  <circle cx="500" cy="80" r="140" fill="white" opacity="0.08" filter="url(#glow)"/>
  <circle cx="100" cy="320" r="100" fill="white" opacity="0.05"/>
  
  <!-- Icon Circle -->
  <rect x="50" y="50" width="90" height="90" rx="24" fill="white" opacity="0.95"/>
  <text x="95" y="108" font-size="44" text-anchor="middle" dominant-baseline="middle">🖥️</text>
  
  <!-- Badge -->
  
  <rect x="160" y="60" width="108" height="32" rx="16" fill="#f59e0b"/>
  <text x="214" y="81" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="white" text-anchor="middle" letter-spacing="1">GURU TIK</text>
  
  
  <!-- Title & Subtitle -->
  <text x="50" y="220" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.5">Felix Kristianto, S.Kom.</text>
  <text x="50" y="260" font-family="system-ui, sans-serif" font-weight="500" font-size="16" fill="#e2e8f0" opacity="0.9">Guru TIK / Komputer & Multimedia</text>
  
  <!-- Accent line -->
  <rect x="50" y="300" width="80" height="4" rx="2" fill="#f59e0b"/>
</svg>